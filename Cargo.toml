[workspace]
resolver = "3"
members = [
    "crates/baad",
    "crates/baad-cli",
    "crates/baad-dm",
    "crates/baad-ffi/baad",
    "crates/baad-ffi/baad-dm",
    "crates/baad-ffi/baad-shared",
    "crates/baad-ffi/baad-utils",
    "crates/baad-ffi/build-support",
    "crates/baad-shared",
    "crates/baad-utils",
]
default-members = [
    "crates/baad",
    "crates/baad-cli",
    "crates/baad-dm",
    "crates/baad-shared",
    "crates/baad-utils",
]

[workspace.package]
version = "3.1.0"
edition = "2024"
authors = ["Zinth"]

[workspace.dependencies]
baad = { path = "crates/baad" }
baad-dm = { path = "crates/baad-dm" }
baad-ffi-build = { path = "crates/baad-ffi/build-support" }
baad-shared = { path = "crates/baad-shared" }
baad-utils = { path = "crates/baad-utils", default-features = false }
bacy = { git = "https://github.com/Deathemonic/BA-CY", version = "3.3.0" }

bitflags = "2"
bon = "3"
derive_more = { version = "2", default-features = false, features = ["debug"] }
eyre = "0.6"
fastcat = "1.1"
lazy-regex = "3.6"
memorypack = "1.2.2"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.52", features = ["full"] }
tracing = "0.1"
uniffi = "0.32"

[workspace.lints.clippy]
absolute_paths = "warn"
absurd_extreme_comparisons = "warn"
as_pointer_underscore = "warn"
as_ptr_cast_mut = "warn"
as_underscore = "warn"
assigning_clones = "warn"
bool_to_int_with_if = "warn"
borrow_as_ptr = "warn"
branches_sharing_code = "warn"
clear_with_drain = "warn"
cloned_instead_of_copied = "warn"
collapsible_else_if = "warn"
collection_is_never_read = "warn"
comparison_chain = "warn"
create_dir = "warn"
default_trait_access = "warn"
derive_partial_eq_without_eq = "warn"
doc_broken_link = "warn"
doc_link_with_quotes = "warn"
duration_suboptimal_units = "warn"
elidable_lifetime_names = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
fn_params_excessive_bools = "warn"
format_collect = "warn"
format_push_string = "warn"
if_not_else = "warn"
imprecise_flops = "warn"
inconsistent_struct_constructor = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
ip_constant = "warn"
iter_filter_is_ok = "warn"
iter_filter_is_some = "warn"
iter_not_returning_iterator = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_with_drain = "warn"
macro_use_imports = "warn"
manual_assert = "warn"
manual_assert_eq = "warn"
manual_bit_width = "warn"
manual_ilog2 = "warn"
manual_instant_elapsed = "warn"
manual_is_power_of_two = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_midpoint = "warn"
manual_string_new = "warn"
many_single_char_names = "warn"
map_unwrap_or = "warn"
match_bool = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
mismatching_type_param_order = "warn"
missing_const_for_fn = "warn"
mut_mut = "warn"
naive_bytecount = "warn"
needless_bitwise_bool = "warn"
needless_collect = "warn"
needless_continue = "warn"
needless_for_each = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
needless_raw_string_hashes = "warn"
needless_type_cast = "warn"
no_effect_underscore_binding = "warn"
no_mangle_with_rust_abi = "warn"
non_std_lazy_statics = "warn"
nonminimal_bool = "warn"
option_as_ref_cloned = "warn"
option_if_let_else = "warn"
option_option = "warn"
overly_complex_bool_expr = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ptr_offset_by_literal = "warn"
pub_underscore_fields = "warn"
range_minus_one = "warn"
range_plus_one = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
redundant_pub_crate = "warn"
redundant_test_prefix = "warn"
redundant_type_annotations = "warn"
ref_as_ptr = "warn"
ref_binding_to_reference = "warn"
ref_option = "warn"
ref_option_ref = "warn"
ref_patterns = "warn"
same_functions_in_if_condition = "warn"
search_is_some = "warn"
self_only_used_in_recursion = "warn"
semicolon_if_nothing_returned = "warn"
semicolon_inside_block = "warn"
significant_drop_in_scrutinee = "warn"
single_char_pattern = "warn"
single_match_else = "warn"
str_split_at_newline = "warn"
string_add_assign = "warn"
string_lit_as_bytes = "warn"
string_lit_chars_any = "warn"
struct_field_names = "warn"
suboptimal_flops = "warn"
suspicious_xor_used_as_pow = "warn"
tests_outside_test_module = "warn"
todo = "warn"
too_many_lines = "warn"
trait_duplication_in_bounds = "warn"
transmute_ptr_to_ptr = "warn"
try_err = "warn"
type_repetition_in_bounds = "warn"
unicode_not_nfc = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unnecessary_box_returns = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_join = "warn"
unnecessary_literal_bound = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unnecessary_semicolon = "warn"
unnecessary_struct_initialization = "warn"
unnecessary_trailing_comma = "warn"
unnecessary_wraps = "warn"
unneeded_field_pattern = "warn"
unnested_or_patterns = "warn"
unreachable = "warn"
unreadable_literal = "warn"
unseparated_literal_suffix = "warn"
unused_async = "warn"
unused_async_trait_impl = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
unused_self = "warn"
unwrap_used = "warn"
use_self = "warn"
used_underscore_items = "warn"
useless_let_if_seq = "warn"
verbose_bit_mask = "warn"
verbose_file_reads = "warn"
while_float = "warn"
with_capacity_zero = "warn"
zero_sized_map_values = "warn"