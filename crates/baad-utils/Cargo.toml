[package]
name = "baad-utils"
version.workspace = true
edition.workspace = true

[features]
default = ["logs"]
logs = [
    "dep:tracing",
    "dep:eyre",
    "dep:tracing-subscriber",
    "dep:tracing-appender",
    "dep:terminal_size",
    "dep:better_default",
    "dep:owo-colors",
    "dep:chrono",
    "dep:smallvec",
    "dep:itoa",
    "dep:lazy-regex",
]

[dependencies]
baad-shared = { workspace = true }

lazy-regex = { workspace = true, optional = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true, optional = true }

platform-dirs = "0.3"
simdutf8 = "0.1"

better_default = { version = "1.0", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
eyre = { workspace = true, optional = true }
itoa = { version = "1.0", optional = true }
owo-colors = { version = "4.2", features = ["supports-colors"], optional = true }
smallvec = { version = "1.15", optional = true }
terminal_size = { version = "0.4", optional = true }
tracing-appender = { version = "0.2.4", features = ["parking_lot"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
