[package]
name = "baad"
version.workspace = true
edition.workspace = true

[features]
default = ["logs"]
logs = ["baad-utils/logs", "baad-utils/observer"]

[dependencies]
baad-dm = { workspace = true }
baad-shared = { workspace = true }
baad-utils = { workspace = true, default-features = false, features = ["utils"] }
bacy = { workspace = true }

bitflags = { workspace = true }
bon = { workspace = true }
fastcat = { workspace = true }
lazy-regex = { workspace = true }
memorypack = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

base64 = "0.22"
glob = "0.3"
memchr = "2.7.6"
nucleo = "0.5"
rayon = "1.11.0"
urlencoding = "2.1.3"

[lints]
workspace = true
