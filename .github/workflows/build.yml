name: Build and Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ffi_only:
        description: Build FFI only
        type: boolean
        default: false
      tag:
        type: string
      prerelease:
        type: boolean
        default: false

jobs:
  build:
    name: Build for ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    if: github.event_name != 'workflow_dispatch' || inputs.ffi_only != true

    strategy:
      matrix:
        config:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, binary: baad }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, binary: baad }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, binary: baad.exe }
          - { name: windows-aarch64, os: windows-latest, target: aarch64-pc-windows-msvc, binary: baad.exe }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, binary: baad }
          - { name: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin, binary: baad }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.config.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target ${{ matrix.config.target }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baad-${{ matrix.config.name }}
          path: target/${{ matrix.config.target }}/release/${{ matrix.config.binary }}

  build-ffi:
    name: Build FFI for ${{ matrix.config.os_name }} ${{ matrix.config.arch_name }}
    runs-on: ${{ matrix.config.runner }}

    strategy:
      matrix:
        config:
          - { os_name: windows, arch_name: x64, runner: windows-latest, rust_target: x86_64-pc-windows-msvc, ext: dll, lib_prefix: "", lib_suffix: ".dll" }
          - { os_name: windows, arch_name: arm64, runner: windows-latest, rust_target: aarch64-pc-windows-msvc, ext: dll, lib_prefix: "", lib_suffix: ".dll" }
          - { os_name: linux, arch_name: x64, runner: ubuntu-latest, rust_target: x86_64-unknown-linux-gnu, ext: so, lib_prefix: "lib", lib_suffix: ".so" }
          - { os_name: linux, arch_name: arm64, runner: ubuntu-24.04-arm, rust_target: aarch64-unknown-linux-gnu, ext: so, lib_prefix: "lib", lib_suffix: ".so" }
          - { os_name: mac, arch_name: x64, runner: macos-latest, rust_target: x86_64-apple-darwin, ext: dylib, lib_prefix: "lib", lib_suffix: ".dylib" }
          - { os_name: mac, arch_name: arm64, runner: macos-latest, rust_target: aarch64-apple-darwin, ext: dylib, lib_prefix: "lib", lib_suffix: ".dylib" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.rust_target }}

      - name: Install cross linker (linux aarch64)
        if: matrix.config.rust_target == 'aarch64-unknown-linux-gnu' && matrix.config.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ffi-${{ matrix.config.rust_target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (C API)
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.config.rust_target }} \
            -p baad-ffi -p baad-dm-ffi -p baad-shared-ffi -p baad-utils-ffi

      - name: Prepare C API artifact
        shell: bash
        run: |
          set -euo pipefail
          target_dir="target/${{ matrix.config.rust_target }}/release"
          out_dir="sdk/c_ffi/${{ matrix.config.os_name }}/${{ matrix.config.arch_name }}"
          mkdir -p "$out_dir"
          for lib in baad baad_dm baad_shared baad_utils; do
            cp "${target_dir}/${{ matrix.config.lib_prefix }}${lib}${{ matrix.config.lib_suffix }}" "$out_dir/"
            if [ "${{ matrix.config.os_name }}" = "windows" ]; then
              cp "${target_dir}/${{ matrix.config.lib_prefix }}${lib}${{ matrix.config.lib_suffix }}.lib" "$out_dir/" || true
            fi
          done

      - name: Build (uniffi)
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.config.rust_target }} \
            -p baad-ffi -p baad-dm-ffi -p baad-shared-ffi -p baad-utils-ffi \
            --features baad-ffi/uniffi,baad-dm-ffi/uniffi,baad-shared-ffi/uniffi,baad-utils-ffi/uniffi

      - name: Prepare uniffi artifact
        shell: bash
        run: |
          set -euo pipefail
          target_dir="target/${{ matrix.config.rust_target }}/release"
          out_dir="sdk/uniffi/${{ matrix.config.os_name }}/${{ matrix.config.arch_name }}"
          mkdir -p "$out_dir"
          for lib in baad baad_dm baad_shared baad_utils; do
            cp "${target_dir}/${{ matrix.config.lib_prefix }}${lib}${{ matrix.config.lib_suffix }}" "$out_dir/"
            if [ "${{ matrix.config.os_name }}" = "windows" ]; then
              cp "${target_dir}/${{ matrix.config.lib_prefix }}${lib}${{ matrix.config.lib_suffix }}.lib" "$out_dir/" || true
            fi
          done

      - name: Generate uniffi bindings
        shell: bash
        run: |
          set -euo pipefail
          target_dir="target/${{ matrix.config.rust_target }}/release"
          bindings_dir="sdk/uniffi/${{ matrix.config.os_name }}/${{ matrix.config.arch_name }}/bindings"

          for crate_lib in \
            "baad-ffi:baad" \
            "baad-dm-ffi:baad_dm" \
            "baad-shared-ffi:baad_shared" \
            "baad-utils-ffi:baad_utils"; do
            crate="${crate_lib%%:*}"
            lib="${crate_lib#*:}"
            lib_name="${{ matrix.config.lib_prefix }}${lib}${{ matrix.config.lib_suffix }}"
            for lang in kotlin swift python ruby; do
              out="${bindings_dir}/${lib}/${lang}"
              mkdir -p "$out"
              cargo run --release --target ${{ matrix.config.rust_target }} \
                -p "$crate" --bin uniffi-bindgen --features uniffi,uniffi_cli -- \
                generate \
                --library "${target_dir}/${lib_name}" \
                --language "$lang" \
                --out-dir "$out"
            done
          done

      - name: Upload C API Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c_ffi-${{ matrix.config.os_name }}-${{ matrix.config.arch_name }}
          path: sdk/c_ffi/${{ matrix.config.os_name }}/${{ matrix.config.arch_name }}/

      - name: Upload uniffi Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uniffi-${{ matrix.config.os_name }}-${{ matrix.config.arch_name }}
          path: sdk/uniffi/${{ matrix.config.os_name }}/${{ matrix.config.arch_name }}/

  deploy:
    name: Release
    needs: [build, build-ffi]
    runs-on: ubuntu-latest
    if: (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.tag != '') && (github.event_name != 'workflow_dispatch' || inputs.ffi_only != true)
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        if: inputs.tag != ''
        uses: actions/checkout@v4

      - name: Create tag
        if: inputs.tag != ''
        run: |
          git tag ${{ inputs.tag }}
          git push origin ${{ inputs.tag }}

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Package
        run: |
          set -euo pipefail
          cd artifacts

          mkdir -p sdk
          for dir in c_ffi-*/ uniffi-*/; do
            dir_name=${dir%/}
            abi=${dir_name%%-*}
            rest=${dir_name#*-}
            os_name=${rest%-*}
            arch_name=${rest##*-}
            mkdir -p "sdk/${abi}/${os_name}/${arch_name}"
            cp -r "${dir_name}/." "sdk/${abi}/${os_name}/${arch_name}/"
          done

          (cd sdk && zip -r ../baad-ffi-sdk.zip uniffi c_ffi)
          rm -rf sdk

          for dir in baad-*/; do
            dir_name=${dir%/}
            (cd "$dir_name" && zip "../${dir_name}.zip" ./*)
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*.zip
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
