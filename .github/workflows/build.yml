name: Build and Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        type: string
      prerelease:
        type: boolean
        default: false

jobs:
  build:
    name: Build for ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      matrix:
        config:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, binary: baad }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, binary: baad.exe }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, binary: baad }
          - { name: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin, binary: baad }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.config.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target ${{ matrix.config.target }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baad-${{ matrix.config.name }}
          path: target/${{ matrix.config.target }}/release/${{ matrix.config.binary }}

  deploy:
    name: Release
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        if: inputs.tag != ''
        uses: actions/checkout@v4

      - name: Create tag
        if: inputs.tag != ''
        run: |
          git tag ${{ inputs.tag }}
          git push origin ${{ inputs.tag }}

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Package
        run: |
          cd artifacts
          for dir in */; do
            dir_name=${dir%/}
            cd "$dir"
            zip "../${dir_name}.zip" ./*
            cd ..
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*.zip
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
