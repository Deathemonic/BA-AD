name: Build and Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ffi_only:
        description: Build FFI only
        type: boolean
        default: false
      tag:
        type: string
      prerelease:
        type: boolean
        default: false

jobs:
  build:
    name: Build for ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    if: github.event_name != 'workflow_dispatch' || inputs.ffi_only != true

    strategy:
      matrix:
        config:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, binary: baad }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, binary: baad }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, binary: baad.exe }
          - { name: windows-aarch64, os: windows-latest, target: aarch64-pc-windows-msvc, binary: baad.exe }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, binary: baad }
          - { name: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin, binary: baad }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.config.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target ${{ matrix.config.target }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: baad-${{ matrix.config.name }}
          path: target/${{ matrix.config.target }}/release/${{ matrix.config.binary }}

  build-ffi:
    name: Build FFI for ${{ matrix.config.os_name }} ${{ matrix.config.arch_name }}
    runs-on: ${{ matrix.config.runner }}

    strategy:
      matrix:
        config:
          - { os_name: windows, arch_name: x64, runner: windows-latest, rust_target: x86_64-pc-windows-msvc }
          - { os_name: windows, arch_name: arm64, runner: windows-11-vs2026-arm, rust_target: aarch64-pc-windows-msvc }
          - { os_name: linux, arch_name: x64, runner: ubuntu-latest, rust_target: x86_64-unknown-linux-gnu }
          - { os_name: linux, arch_name: arm64, runner: ubuntu-24.04-arm, rust_target: aarch64-unknown-linux-gnu }
          - { os_name: mac, arch_name: x64, runner: macos-26-intel, rust_target: x86_64-apple-darwin }
          - { os_name: mac, arch_name: arm64, runner: macos-latest, rust_target: aarch64-apple-darwin }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.rust_target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ffi-${{ matrix.config.rust_target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup MSVC toolchain
        if: matrix.config.os_name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.config.arch_name == 'arm64' && 'arm64' || 'x64' }}

      - name: Build C library
        run: cargo build --locked --release --target ${{ matrix.config.rust_target }} -p baad-ffi

      - name: Package C library and headers
        run: cargo run --locked -p baad-ffi-build -- --target ${{ matrix.config.rust_target }} --out sdk/c_ffi/${{ matrix.config.os_name }}/${{ matrix.config.arch_name }}

      - name: Upload C API artifacts
        uses: actions/upload-artifact@v7
        with:
          name: c_ffi-${{ matrix.config.os_name }}-${{ matrix.config.arch_name }}
          path: sdk/c_ffi/${{ matrix.config.os_name }}/${{ matrix.config.arch_name }}/

  deploy:
    name: Release
    needs: [build, build-ffi]
    runs-on: ubuntu-latest
    if: (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.tag != '') && (github.event_name != 'workflow_dispatch' || inputs.ffi_only != true)
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        if: inputs.tag != ''
        uses: actions/checkout@v7

      - name: Create tag
        if: inputs.tag != ''
        run: |
          git tag ${{ inputs.tag }}
          git push origin ${{ inputs.tag }}

      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./artifacts

      - name: Package
        run: |
          set -euo pipefail
          cd artifacts

          mkdir -p sdk
          for dir in c_ffi-*/; do
            dir_name=${dir%/}
            abi=${dir_name%%-*}
            rest=${dir_name#*-}
            os_name=${rest%-*}
            arch_name=${rest##*-}
            mkdir -p "sdk/${abi}/${os_name}/${arch_name}"
            cp -r "${dir_name}/." "sdk/${abi}/${os_name}/${arch_name}/"
          done

          (cd sdk && zip -r ../baad-c-api.zip c_ffi)
          rm -rf sdk

          for dir in baad-*/; do
            dir_name=${dir%/}
            (cd "$dir_name" && zip "../${dir_name}.zip" ./*)
          done

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*.zip
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}